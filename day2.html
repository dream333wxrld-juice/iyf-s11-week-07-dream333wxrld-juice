<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2: Recent Searches</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-container {
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #searchInput:focus {
            outline: none;
            border-color: #3498db;
        }

        #historyDropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-top: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
            z-index: 10;
        }

        #historyDropdown.show {
            display: block;
        }

        #historyDropdown div {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }

        #historyDropdown div:last-child {
            border-bottom: none;
        }

        #historyDropdown div:hover {
            background-color: #f5f5f5;
        }

        .clear-history {
            color: #e74c3c;
            text-align: center;
            font-size: 0.85rem;
        }

        #results {
            margin-top: 20px;
            padding: 15px;
            background-color: #eafaf1;
            border-radius: 6px;
            display: none;
        }

        #results.show {
            display: block;
        }
    </style>
</head>
<body>

    <h1>Recent Searches</h1>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search something..." autocomplete="off">
        <div id="historyDropdown"></div>
    </div>

    <div id="results"></div>

    <script>
        const SEARCH_KEY = "recentSearches";
        const searchInput = document.getElementById("searchInput");
        const historyDropdown = document.getElementById("historyDropdown");
        const results = document.getElementById("results");

        function getSearchHistory() {
            const data = localStorage.getItem(SEARCH_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveSearch(term) {
            let history = getSearchHistory();
            history = history.filter(item => item.toLowerCase() !== term.toLowerCase());
            history.unshift(term);
            history = history.slice(0, 5);
            localStorage.setItem(SEARCH_KEY, JSON.stringify(history));
        }

        function renderDropdown() {
            const history = getSearchHistory();

            if (history.length === 0) {
                historyDropdown.classList.remove("show");
                return;
            }

            historyDropdown.innerHTML = history.map(term => `
                <div class="history-item" data-term="${term}">${term}</div>
            `).join("") + `<div class="clear-history">Clear History</div>`;

            historyDropdown.classList.add("show");
        }

        function performSearch(term) {
            saveSearch(term);
            results.textContent = `Showing results for: "${term}"`;
            results.classList.add("show");
            searchInput.value = term;
            historyDropdown.classList.remove("show");
        }

        searchInput.addEventListener("focus", renderDropdown);

        searchInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter" && searchInput.value.trim()) {
                performSearch(searchInput.value.trim());
            }
        });

        historyDropdown.addEventListener("click", function(event) {
            if (event.target.classList.contains("history-item")) {
                performSearch(event.target.dataset.term);
            } else if (event.target.classList.contains("clear-history")) {
                localStorage.removeItem(SEARCH_KEY);
                historyDropdown.classList.remove("show");
            }
        });

        document.addEventListener("click", function(event) {
            if (!event.target.closest(".search-container")) {
                historyDropdown.classList.remove("show");
            }
        });
    </script>

</body>
</html>
